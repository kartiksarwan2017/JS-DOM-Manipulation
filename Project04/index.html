<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <script src="https://kit.fontawesome.com/0a9b7b3b75.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div id="timer">
            00:00:00
        </div>

        <div class="buttons">
            <div id="startStopBtn">
                <button>
                    <i class="fa-solid fa-play" id="play"></i>
                </button>
            </div>
            <div id="resetBtn">
                <button>
                    <i class="fa-solid fa-arrow-rotate-left" id="reset"></i>
                </button>
            </div>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
